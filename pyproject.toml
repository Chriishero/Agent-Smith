[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "argparse>=1.4.0",
    "dotenv",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["setuptools"]

[tool.setuptools]
py-modules = ["agent_smith", "agent_mbpp", "agent_swebench"]

[project.scripts]
sandbox = "agent_smith.sandbox.cli:main"
